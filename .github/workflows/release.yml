name: Build release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $source = Get-Content app.py -Raw
          if ($source -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') { throw "APP_VERSION not found" }
          if ($Matches[1] -ne $tag) { throw "APP_VERSION does not match tag" }
      - name: Build
        run: pyinstaller --clean --noconfirm AutoSaveNotepad.spec
      - name: SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist\AutoSaveNotepad.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  AutoSaveNotepad.exe" | Set-Content -Encoding ascii dist\AutoSaveNotepad.exe.sha256
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/AutoSaveNotepad.exe
            dist/AutoSaveNotepad.exe.sha256
